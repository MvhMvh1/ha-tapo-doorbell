name: Release

# Bij elke push naar main: staat er een nieuw versienummer in manifest.json,
# dan wordt automatisch een tag + GitHub-release gemaakt. HACS ziet die als update.
on:
  push:
    branches: [main]
    paths: [custom_components/tapo_doorbell/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release maken als versie nieuw is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version custom_components/tapo_doorbell/manifest.json)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al"
            exit 0
          fi
          NOTES_FILE=".github/release-notes/$TAG.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
